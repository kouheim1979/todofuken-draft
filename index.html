const state={screen:'title',playerCount:2,pickPer:2,draftType:'order',category:'overall',roundCategory:'overall',players:[],pickTurn:0,pickRound:1,orderTurn:0,currentRound:1,battleLog:[],search:'',online:{enabled:!!(SUPABASE_URL&&SUPABASE_ANON_KEY)}};

const S={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}},clear(){try{localStorage.removeItem('tdb_save')}catch{}}};
function overall(p){return Math.round(['population','agriculture','industry','height','academics','sports','area','tourism','joke'].reduce((a,k)=>a+p[k],0)/9)}
function label(k){return (CATEGORIES.find(x=>x.key===k)||CATEGORIES[0]).label}
function maxPick(cnt){return Math.max(1,Math.floor(47/cnt))}
function mkPlayers(){state.players=Array.from({length:state.playerCount},(_,i)=>{const old=state.players[i]||{};return {id:i+1,name:old.name||`プレイヤー${i+1}`,hometown:old.hometown||null,picks:[],wins:0,bonusHits:0};});}
function selectedBy(){const m={};state.players.forEach(p=>p.picks.forEach(id=>m[id]={playerId:p.id,playerName:p.name}));return m}
function activePickPlayer(){return state.players[state.pickTurn]}
function allPicked(){return state.players.every(p=>p.picks.length===state.pickPer)}
function nextPickTurn(){
if(allPicked())return;
if(state.draftType==='order'){
  const n=state.players.length;
  for(let step=1;step<=n;step++){
    const idx=(state.pickTurn+step)%n;
    if(state.players[idx].picks.length<state.pickPer){state.pickTurn=idx;return;}
  }
  return;
}
const n=state.players.length,total=state.players.reduce((a,p)=>a+p.picks.length,0),r=Math.floor(total/n),pos=total%n;
const preferred=(r%2===0)?pos:(n-1-pos);
if(state.players[preferred].picks.length<state.pickPer){state.pickTurn=preferred;return;}
for(let step=1;step<=n;step++){
  const idx=(preferred+step)%n;
  if(state.players[idx].picks.length<state.pickPer){state.pickTurn=idx;return;}
}}
function togglePick(prefId){const p=activePickPlayer();const own=selectedBy()[prefId];if(own&&own.playerId!==p.id)return;const i=p.picks.indexOf(prefId);if(i>=0)p.picks.splice(i,1);else if(p.picks.length<state.pickPer){p.picks.push(prefId);if(!allPicked())nextPickTurn();}if(allPicked()){alert('全員選び終わったので並び替えへ！');state.screen='order';}render()}
function validBeforeBattle(){return state.players.every(p=>p.picks.length===state.pickPer)}
function prepareRoundCategory(){if(state.category==='random'){const keys=CATEGORIES.map(x=>x.key).filter(k=>!['overall','random'].includes(k));state.roundCategory=keys[Math.floor(Math.random()*keys.length)]}else state.roundCategory=state.category}
function fightRound(){const idx=state.currentRound-1;const cards=[];for(const p of state.players){const pref=PREFECTURES.find(x=>x.id===p.picks[idx]);if(!pref)continue;const bonus=p.hometown===pref.id?HOMETOWN_BONUS:0;if(bonus)p.bonusHits++;const base=state.roundCategory==='overall'?overall(pref):pref[state.roundCategory];cards.push({p,pref,base,bonus,final:base+bonus,tie:overall(pref)+bonus});}
if(cards.length===0){alert('対戦データ不足です');return}
cards.sort((a,b)=>b.final-a.final||b.tie-a.tie);let top=cards.filter(c=>c.final===cards[0].final&&c.tie===cards[0].tie),reason='';if(top.length>1){top.sort((a,b)=>((b.bonus?1:0)-(a.bonus?1:0))||(b.pref.joke-a.pref.joke));reason='チャピ子判定: 同点タイブレーク（総合力→ネタ力）で決着！';}else reason='スコア勝利！';top[0].p.wins++;const log={round:state.currentRound,cards,winner:top[0].p.id,reason,category:state.roundCategory};log.commentary=generateBattleCommentary(log);state.battleLog.push(log);render()}
function categoryPhrase(key){return {population:'人口規模の大きさ',agriculture:'農業の強さ',industry:'ものづくりの力',academics:'学力の高さ',tourism:'観光地としての魅力',joke:'個性や話題性',sports:'運動能力',area:'面積の広さ',height:'平均身長',overall:'総合バランス'}[key]||'総合力'}
function generateBattleCommentary(log){const w=log.cards.find(c=>c.p.id===log.winner);const second=log.cards[1];const item=label(log.category);let txt=`今回の勝負項目は「${item}」。${w.pref.name}が勝利！ `;txt+=`${categoryPhrase(log.category)}で ${w.base} 点を記録`;if(w.bonus)txt+=`、地元ボーナス +${w.bonus} も加わり`;txt+=`最終 ${w.final} 点でした。`;if(second)txt+=` 2位は${second.pref.name}の${second.final}点。`;if(log.reason.includes('チャピ子'))txt+=' 同点だったため、総合力やネタ力を使ったタイブレークで決着しました。';txt+=` 「${w.pref.catchphrase}」`;return txt}
function sortableNotice(){return window.Sortable?"":"<div class='warn'>⚠️ 並び替え機能を読み込み中です。失敗した場合はページを再読み込みしてください。</div>"}
function nextRound(){if(state.currentRound<state.pickPer){state.currentRound++;prepareRoundCategory();render()}else state.screen='result',render()}
function resetGame(){state.screen='title';state.pickTurn=0;state.orderTurn=0;state.currentRound=1;state.players=[];state.battleLog=[];render()}
function render(){app.innerHTML='';if(state.screen==='title')app.innerHTML=`<h1 class='title'>🗾 都道府県ドラフトバトル</h1><p class='center'>都道府県をドラフトしてバトル！</p><div class='card center'><button class='btn' id='local'>ローカルで遊ぶ</button><button class='btn' disabled>部屋機能（Supabase対応予定）</button><p class='small'>複数端末プレイは次の段階で対応。今はローカルプレイのみ。</p></div>`;
if(state.screen==='setup'){const selectable=maxPick(state.playerCount);if(state.pickPer>selectable)state.pickPer=selectable;app.innerHTML=`<h2 class='title'>🎮✨ 設定</h2><p class='center sectionTitle'>わくわくルールを決めよう！</p>${sortableNotice()}<div class='card'><div class='row'><div style='flex:1'><p>プレイ人数</p><div class='row'><button class='btn neoBtn' id='pcMinus'>−</button><div class='num'>${state.playerCount}</div><button class='btn neoBtn' id='pcPlus'>＋</button></div></div><div style='flex:1'><p>選べる県数</p><div class='row'><button class='btn neoBtn' id='ppMinus'>−</button><div class='num'>${state.pickPer}</div><button class='btn neoBtn' id='ppPlus'>＋</button></div></div></div><p>今回は1人最大 <b>${selectable}県</b> まで選べます（47 ÷ 人数）</p><label>ドラフト方式<select id='dt'><option value='order'>順番ドラフト</option><option value='snake'>スネークドラフト</option></select></label><label>勝負項目<select id='ct'>${CATEGORIES.map(c=>`<option value='${c.key}'>${c.label}</option>`).join('')}</select></label><p class='small'>ランダムは人口・農業・工業などから毎ラウンド選ばれます</p><button class='btn' id='rst'>保存データをリセット</button></div><div class='grid cards' id='playerSort'>${state.players.map((p,i)=>`<div class='card od' data-i='${i}' style='background:#fff8ff'><div><span class='dragHandle'>☰</span><b>${p.name||'プレイヤー'}</b></div><label>名前<input class='nm' data-i='${i}' value='${p.name}'></label><label>出身地を選ぶ（地元ボーナス用）<select class='hm' data-i='${i}'><option value=''>出身地：未選択</option>${PREFECTURES.map(x=>`<option value='${x.id}' ${p.hometown===x.id?'selected':''}>${x.name}</option>`).join('')}</select></label></div>`).join('')}</div><button class='btn' id='goDraft'>都道府県選択へ</button>`}
if(state.screen==='draft'){const me=activePickPlayer(),map=selectedBy();const q=state.search;const regions=['北海道','東北','関東','中部','近畿','中国','四国','九州','沖縄'];app.innerHTML=`<h2 class='title'>🧩 都道府県選択</h2><div class='card'><div class='kicker'>いま選ぶ人: ${me.name}</div><p>${me.name} の選択数: ${me.picks.length}/${state.pickPer}</p><input id='srch' placeholder='検索' value='${q}'></div>${regions.map(r=>`<div class='card'><h3>${r}</h3><div class='grid cards'>${PREFECTURES.filter(p=>p.region===r&&(p.name.includes(q)||p.region.includes(q))).map(p=>{const owner=map[p.id],mine=owner&&owner.playerId===me.id,locked=owner&&owner.playerId!==me.id;return `<div class='pref ${mine?'mine':''} ${locked?'locked':''}' data-id='${p.id}'><b>${p.name}</b><div class='small'>${p.catchphrase}</div>${me.hometown===p.id?'<span class="badge home">地元</span>':''}${owner?` <span class='badge ${locked?'lock':''}'>選択済み:${owner.playerName}</span>`:''}</div>`}).join('')}</div></div>`).join('')}<button class='btn' id='toOrder' ${allPicked()?'':'disabled'}>全員選択済み → 並び替え</button>`}
if(state.screen==='order'){const p=state.players[state.orderTurn];app.innerHTML=`<h2 class='title'>🔀🪄 並び替え</h2>${sortableNotice()}<div class='card'><div class='kicker'>並び替え中: ${p.name}</div><p class='pill'>☝️ ドラッグして並び替え（スマホでもOK）</p><ul id='olist'>${p.picks.map((id,i)=>{const pref=PREFECTURES.find(x=>x.id===id);return `<li class='card od' data-i='${i}'><span class='dragHandle'>☰</span><b>${i+1}番手: ${pref.name}</b> ${p.hometown===id?'<span class="badge home">地元</span>':''}</li>`}).join('')}</ul><button class='btn' id='orderNext'>${state.orderTurn<state.players.length-1?'この並びで次のプレイヤーへ':'全員完了 → バトル開始'}</button></div>`}
if(state.screen==='battle'){const log=state.battleLog.find(x=>x.round===state.currentRound);app.innerHTML=`<h2 class='title'>⚔️ バトル ${state.currentRound}/${state.pickPer}</h2><div class='kicker'>勝負項目: ${label(state.roundCategory)}</div><div class='grid cards'>${state.players.map(p=>{const pref=PREFECTURES.find(x=>x.id===p.picks[state.currentRound-1]);if(!pref)return `<div class='card'>${p.name}: 未選択</div>`;const bonus=p.hometown===pref.id?HOMETOWN_BONUS:0;const base=state.roundCategory==='overall'?overall(pref):pref[state.roundCategory];const win=log&&log.winner===p.id;return `<div class='card ${win?'winner':''}'><h3>${p.name}</h3><p>${pref.name}</p><p>基本:${base}</p>${bonus?`<p><span class='badge bonus'>地元愛ボーナス +5</span></p>`:''}<p><b>最終:${base+bonus}</b></p></div>`}).join('')}</div>${log?`<div class='card'><b>勝者: ${state.players.find(p=>p.id===log.winner).name}</b><p>${log.reason}</p><div class='card' style='margin-top:8px;background:#fff7fb'><b>📝 解説</b><p>${log.commentary}</p></div></div><button class='btn' id='nr'>${state.currentRound<state.pickPer?'次ラウンド':'結果へ'}</button>`:`<button class='btn' id='fr'>このラウンドを判定</button>`}`}
if(state.screen==='result'){const rank=[...state.players].sort((a,b)=>b.wins-a.wins);const winByPref={};state.battleLog.forEach(l=>{const w=l.cards.find(c=>c.p.id===l.winner);if(w)winByPref[w.pref.name]=(winByPref[w.pref.name]||0)+1;});const mvp=Object.entries(winByPref).sort((a,b)=>b[1]-a[1])[0];app.innerHTML=`<h2 class='title'>🏆🌈 結果</h2><div class='card winner' style='background:#ffe56f'><h3 class='crown'>👑 1位 ${rank[0].name}</h3><p><b>${rank[0].wins}勝</b></p></div><div class='grid cards'>${rank.map((p,i)=>`<div class='card'><b>${i+1}位 ${p.name}</b><p>勝利数:${p.wins}</p><p>地元ボーナス発動:${p.bonusHits}回</p></div>`).join('')}</div><div class='card'><h3>勝利の理由まとめ</h3>${state.battleLog.map(l=>{const wp=state.players.find(p=>p.id===l.winner);const w=l.cards.find(c=>c.p.id===l.winner),s=l.cards[1];return `<div class='roundCard'><b>${l.round}回戦：${label(l.category)}</b><p>勝者：${wp.name}</p><p>勝利県：${w.pref.name}</p><p>基本点：${w.base} / 地元ボーナス：${w.bonus?`+${w.bonus}`:'なし'} / 最終点：${w.final}</p><p>2位との差：${s?`${w.final-s.final}点`:'-'} </p><p class='small'>解説：${l.commentary}</p></div>`}).join('')}<p><b>MVP県:</b> ${mvp?`${mvp[0]}（${mvp[1]}勝）`:'なし'}</p></div><button class='btn' id='again'>もう一度遊ぶ</button><button class='btn' id='home'>最初へ</button>`}
bind()}
function bind(){const on=(id,fn)=>{const e=document.getElementById(id);if(e)e.onclick=fn;};on('local',()=>{state.screen='setup';const s=S.get('tdb_save',null);if(s)Object.assign(state,s);state.playerCount=Math.min(MAX_PLAYERS,Math.max(MIN_PLAYERS,state.playerCount||2));mkPlayers();render()});
on('pcMinus',()=>{state.playerCount=Math.max(MIN_PLAYERS,state.playerCount-1);if(state.pickPer>maxPick(state.playerCount))state.pickPer=maxPick(state.playerCount);mkPlayers();render()});on('pcPlus',()=>{state.playerCount=Math.min(MAX_PLAYERS,state.playerCount+1);if(state.pickPer>maxPick(state.playerCount))state.pickPer=maxPick(state.playerCount);mkPlayers();render()});on('ppMinus',()=>{state.pickPer=Math.max(1,state.pickPer-1);render()});on('ppPlus',()=>{state.pickPer=Math.min(maxPick(state.playerCount),state.pickPer+1);render()});
document.getElementById('dt')&&(document.getElementById('dt').value=state.draftType,document.getElementById('dt').onchange=e=>state.draftType=e.target.value);
document.getElementById('ct')&&(document.getElementById('ct').value=state.category,document.getElementById('ct').onchange=e=>state.category=e.target.value);
document.querySelectorAll('.nm').forEach(el=>el.oninput=e=>state.players[+e.target.dataset.i].name=e.target.value||`プレイヤー${+e.target.dataset.i+1}`);
document.querySelectorAll('.hm').forEach(el=>el.onchange=e=>state.players[+e.target.dataset.i].hometown=+e.target.value||null);
on('rst',()=>{S.clear();state.playerCount=2;state.pickPer=2;state.draftType='order';state.category='overall';mkPlayers();alert('保存データをリセットしました');render();});
on('goDraft',()=>{state.pickTurn=0;state.pickRound=1;state.search='';state.players.forEach((p,i)=>{p.name=p.name||`プレイヤー${i+1}`;p.picks=[];p.wins=0;p.bonusHits=0});S.set('tdb_save',{playerCount:state.playerCount,pickPer:state.pickPer,draftType:state.draftType,category:state.category,players:state.players.map(p=>({name:p.name,hometown:p.hometown}))});state.screen='draft';render()});
document.getElementById('srch')?.addEventListener('input',e=>{state.search=e.target.value;render()});document.querySelectorAll('.pref').forEach(el=>el.onclick=()=>togglePick(+el.dataset.id));
on('toOrder',()=>{state.orderTurn=0;state.screen='order';render()});
const list=document.getElementById('olist');if(list&&window.Sortable){Sortable.create(list,{animation:200,handle:'.dragHandle',ghostClass:'ghost',chosenClass:'chosen',onEnd:(evt)=>{if(evt.oldIndex===evt.newIndex)return;const arr=state.players[state.orderTurn].picks;const [x]=arr.splice(evt.oldIndex,1);arr.splice(evt.newIndex,0,x);render();}});}
const pl=document.getElementById('playerSort');if(pl&&window.Sortable){Sortable.create(pl,{animation:200,handle:'.dragHandle',ghostClass:'ghost',chosenClass:'chosen',onEnd:(evt)=>{if(evt.oldIndex===evt.newIndex)return;const [x]=state.players.splice(evt.oldIndex,1);state.players.splice(evt.newIndex,0,x);render();}});}
on('orderNext',()=>{if(state.orderTurn<state.players.length-1){state.orderTurn++;render();return}if(!validBeforeBattle()){alert('未選択プレイヤーがいます');return}state.currentRound=1;state.battleLog=[];prepareRoundCategory();state.screen='battle';render()});
on('fr',fightRound);on('nr',nextRound);on('again',()=>{state.screen='setup';mkPlayers();render()});on('home',resetGame);}
// Supabase将来対応（ローカル動作を壊さないガード）
async function createRoom(){if(!state.online.enabled)return} async function joinRoom(){if(!state.online.enabled)return} async function syncIfOnline(){if(!state.online.enabled)return}
state.screen='title';render();
</script>

</body></html>
