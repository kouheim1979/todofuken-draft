function init(){const saved=safeLS('prefBattleConfig',null,false)||{};state.playerCount=Math.min(6,Math.max(2,saved.playerCount||2));state.pickMode=saved.pickMode||'quick';state.gameMode=saved.gameMode||'individual';render()}

function buildPlayers(){state.playerCount=Math.min(6,Math.max(2,Number(document.getElementById('playerCount').value)||2));state.pickMode=document.querySelector('input[name="pickMode"]:checked')?.value||'quick';state.gameMode=document.querySelector('input[name="gameMode"]:checked')?.value||'individual';state.pickTarget=PICK_COUNTS[state.pickMode];state.players=[];for(let i=0;i<state.playerCount;i++){const n=document.getElementById('name'+i).value.trim()||`プレイヤー${i+1}`;const hometown=Number(document.getElementById('home'+i).value)||null;state.players.push({id:i,name:n,hometown,picks:[],order:[],wins:0,hometownBoostWins:0});}

 else {if(state.sharedPicks.length!==state.pickTarget)return alert('共通県を必要数選んでね！'); state.players.forEach(p=>{p.picks=[...state.sharedPicks];p.order=[...state.sharedPicks]});}

function moveOrder(pi,idx,dir){const arr=state.players[pi].order;const ni=idx+dir;if(ni<0||ni>=arr.length)return;[arr[idx],arr[ni]]=[arr[ni],arr[idx]];render()}

function chapiJudge(entries){const sorted=[...entries].sort((a,b)=>b.pref.joke-a.pref.joke||b.pref.tourism-a.pref.tourism||b.boost-a.boost||a.pref.region.localeCompare(b.pref.region));const win=sorted[0];const msg=`うーん、完全にチャピ子の独断！今日は${win.pref.name}の「${win.pref.catchphrase}」が刺さったので勝ち！`;return {winnerIds:[win.player.id],reason:msg,chapi:true}}
function runBattle(){if(!state.currentCategory)state.currentCategory=CATEGORIES[Math.floor(Math.random()*CATEGORIES.length)].key;
 const entries=state.players.map(p=>{const pref=PREFECTURES.find(x=>x.id===p.order[state.round-1]);const sc=getScore(pref,state.currentCategory,p.hometown);const ov=getScore(pref,'overall',p.hometown);return {player:p,pref,score:sc,overall:ov,boost:sc.bonus>0};});
 let max=Math.max(...entries.map(e=>e.score.total));let winners=entries.filter(e=>e.score.total===max);
 let reason=''; let chapi=false;
 if(winners.length>1){const maxOv=Math.max(...winners.map(w=>w.overall.total));winners=winners.filter(w=>w.overall.total===maxOv);reason='同点！総合力判定へ！';}
 if(winners.length>1){const j=chapiJudge(winners);winners=entries.filter(e=>j.winnerIds.includes(e.player.id));reason=j.reason;chapi=true;}
 winners.forEach(w=>{w.player.wins++;if(w.boost)w.player.hometownBoostWins++;});
 state.lastBattle={entries,winners,reason,chapi,category:state.currentCategory};
 state.roundResults.push(state.lastBattle);
 render();}
function nextRound(){if(state.round>=state.pickTarget){goto('result');return;} state.round++;state.currentCategory='';state.lastBattle=null;render()}
function resultData(){const sorted=[...state.players].sort((a,b)=>b.wins-a.wins);const mvpCount={};state.roundResults.forEach(r=>r.winners.forEach(w=>{mvpCount[w.pref.id]=(mvpCount[w.pref.id]||0)+1}));let mvpId=Number(Object.keys(mvpCount).sort((a,b)=>mvpCount[b]-mvpCount[a])[0]||state.players[0].order[0]);
 const closest=state.roundResults.map((r,i)=>{const vals=r.entries.map(e=>e.score.total).sort((a,b)=>b-a);return {round:i+1,diff:(vals[0]-vals[1]||0)}}).sort((a,b)=>a.diff-b.diff)[0];
 const boostKing=[...state.players].sort((a,b)=>b.hometownBoostWins-a.hometownBoostWins)[0];return {sorted,mvp:PREFECTURES.find(p=>p.id===mvpId),closest,boostKing};}

function optionsPref(selected){return `<option value="">未設定</option>`+PREFECTURES.map(p=>`<option value="${p.id}" ${selected===p.id?'selected':''}>${p.name}</option>`).join('')}
function prefGrid(selectedArr,homeIds,search=''){const byRegion={};PREFECTURES.forEach(p=>{if(search&&!(p.name+p.region+p.catchphrase).includes(search))return;(byRegion[p.region]=byRegion[p.region]||[]).push(p)});
 return Object.entries(byRegion).map(([r,list])=>`<div class="region"><h3>${r}</h3>${list.map(p=>`<button class="pref-btn ${selectedArr.includes(p.id)?'selected':''} ${homeIds.includes(p.id)?'hometown':''}" data-pref="${p.id}">${p.name} ${homeIds.includes(p.id)?'<span class="badge">地元</span>':''}<div class="small">${p.catchphrase}</div></button>`).join('')}</div>`).join('')}
function renderHTML(){const s=state.screen;const cfg=safeLS('prefBattleConfig',null,false)||{};
 if(s==='title')return `<section class="screen active"><div class="card"><h1 class="title">🎌 都道府県ドラフトバトル ⚔️</h1><p>地元愛、データ、そして謎のひいきで勝ちぬけ！</p><p class="muted">都道府県の強さ、今日は何で決まる？人口か？農業か？それともネタ力か？</p><button class="btn alt" id="startBtn">スタート！</button></div></section>`;
 if(s==='setup')return `<section class="screen active"><div class="card"><h2>👥 プレイヤー設定</h2><label>人数(2〜6)<input id="playerCount" type="number" min="2" max="6" value="${state.playerCount}"></label><div class="row"><label><input type="radio" name="pickMode" value="quick" ${state.pickMode==='quick'?'checked':''}>サクッと5県バトル</label><label><input type="radio" name="pickMode" value="serious" ${state.pickMode==='serious'?'checked':''}>ガチめの10県バトル</label></div><div class="row"><label><input type="radio" name="gameMode" value="individual" ${state.gameMode==='individual'?'checked':''}>個別ドラフト</label><label><input type="radio" name="gameMode" value="shared" ${state.gameMode==='shared'?'checked':''}>共通県モード</label></div><div class="grid g2">${Array.from({length:state.playerCount}).map((_,i)=>`<div class="card"><h3>P${i+1}</h3><input id="name${i}" placeholder="プレイヤー名" value="${cfg.names?.[i]||''}"><select id="home${i}">${optionsPref(cfg.homes?.[i]||null)}</select></div>`).join('')}</div><button class="btn green" id="toPick">次へ</button><button class="btn" id="resetSave">保存データをリセット</button></div></section>`;
 if(s==='pick'){const homeIds=state.players.map(p=>p.hometown).filter(Boolean);const selected=state.gameMode==='shared'?state.sharedPicks:state.players[state.selectionIndex].picks;const title=state.gameMode==='shared'?'共通県選択':`${state.players[state.selectionIndex].name} の選択`;return `<section class="screen active"><div class="card"><h2>🗾 都道府県選択 - ${title}</h2><p>選択済み: <b>${selected.length}/${state.pickTarget}</b></p><input id="search" placeholder="検索（県名・地方・キャッチコピー）"> <div class="grid g2" id="prefWrap">${prefGrid(selected,homeIds)}</div><button class="btn green" id="pickNext">${state.gameMode==='individual'&&state.selectionIndex<state.players.length-1?'次のプレイヤーへ':'並び替えへ'}</button></div></section>`}
 if(s==='order')return `<section class="screen active"><div class="card"><h2>🔢 並び替え</h2>${state.players.map((p,pi)=>`<div class="card"><h3>${p.name}</h3>${p.order.map((id,idx)=>{const pref=PREFECTURES.find(x=>x.id===id);return `<div class="row"><span>${idx+1}番手: ${pref.name} ${p.hometown===id?'<span class="badge">地元</span>':''}</span><button class="btn small" data-move="${pi},${idx},-1">上へ</button><button class="btn small" data-move="${pi},${idx},1">下へ</button></div>`}).join('')}</div>`).join('')}<button class="btn orange" id="toBattle">バトル開始！</button></div></section>`;
 if(s==='battle'){const b=state.lastBattle;return `<section class="screen active"><div class="card"><h2>⚔️ バトル画面</h2><p>ラウンド ${state.round}/${state.pickTarget}</p><h3>なにで勝負する？</h3><select id="catSel"><option value="">選択してね</option>${CATEGORIES.map(c=>`<option value="${c.key}" ${state.currentCategory===c.key?'selected':''}>${c.label}</option>`).join('')}</select><div class="row"><button class="btn" id="randomCat">おまかせ項目</button><button class="btn alt" id="fightBtn">この項目でバトル！</button></div>${b?`<div class="battle-cards">${b.entries.map(e=>`<div class="card fighter ${b.winners.includes(e)?'winner':''} ${e.boost?'hometown-active':''}"><h3>${e.player.name}</h3><h4>${e.pref.name}</h4><div>${e.pref.catchphrase}</div><div>基本:${e.score.base} ${e.score.bonus?`<span class='badge'>+${HOMETOWN_BONUS} 地元愛ボーナス！</span>`:''}</div><div><b>補正後:${e.score.total}</b></div><div class='small'>総合力:${e.overall.total}</div>${e.boost?'<div>✨地元の意地を見せた！</div>':''}</div>`).join('')}</div><div class="card ${b.chapi?'rank1':''}"><h3>勝者: ${b.winners.map(w=>w.player.name).join(' / ')}</h3><p>${b.reason||'項目スコア勝負で決着！'}</p>${b.chapi?'<p>🎤 チャピ子判定発動！これはひいきではない、郷土愛です！</p>':''}</div><button class="btn green" id="nextRound">${state.round>=state.pickTarget?'結果へ':'次のラウンドへ'}</button>`:''}</div></section>`}
 if(s==='result'){const r=resultData();return `<section class="screen active"><div class="card"><h2>🏆 結果発表</h2><div class="result-top">1位: ${r.sorted[0].name} (${r.sorted[0].wins}勝)</div>${r.sorted.map((p,i)=>`<div class="card ${i===0?'rank1':''}">${i+1}位 ${p.name} - ${p.wins}勝</div>`).join('')}<div class="card"><h3>MVP都道府県: ${r.mvp.name}</h3><p>${r.mvp.catchphrase}</p><p>一番接戦: ${r.closest.round}回戦（差${r.closest.diff}）</p><p>出身地補正王: ${r.boostKing.name}（${r.boostKing.hometownBoostWins}回ブースト勝利）</p></div><button class="btn orange" id="again">もう一度遊ぶ</button><button class="btn" id="toTitle">最初に戻る</button></div></section>`}
}
function bindEvents(){document.getElementById('startBtn')?.addEventListener('click',()=>goto('setup'));document.getElementById('toPick')?.addEventListener('click',buildPlayers);document.getElementById('resetSave')?.addEventListener('click',resetSaved);
 document.querySelectorAll('[data-pref]').forEach(b=>b.addEventListener('click',()=>pickForCurrent(Number(b.dataset.pref))));document.getElementById('pickNext')?.addEventListener('click',finalizePicks);
 document.getElementById('search')?.addEventListener('input',e=>{document.getElementById('prefWrap').innerHTML=prefGrid((state.gameMode==='shared'?state.sharedPicks:state.players[state.selectionIndex].picks),state.players.map(p=>p.hometown).filter(Boolean),e.target.value);bindEvents();});
 document.querySelectorAll('[data-move]').forEach(b=>b.addEventListener('click',()=>{const [pi,idx,dir]=b.dataset.move.split(',').map(Number);moveOrder(pi,idx,dir)}));
 document.getElementById('toBattle')?.addEventListener('click',readyBattle);document.getElementById('randomCat')?.addEventListener('click',chooseRandomCategory);
 document.getElementById('catSel')?.addEventListener('change',e=>state.currentCategory=e.target.value);document.getElementById('fightBtn')?.addEventListener('click',runBattle);document.getElementById('nextRound')?.addEventListener('click',nextRound);
 document.getElementById('again')?.addEventListener('click',()=>goto('setup'));document.getElementById('toTitle')?.addEventListener('click',()=>goto('title'));}
init();
</script>
</body>
</html>
