function getConcreteMetric(pref, key) {
  if (!pref) return { label: "データ", value: "-", note: "" };

  if (key === "population") {
    const people = Math.round(pref.population * 14);
    return {
      label: "人口",
      value: `約${people.toLocaleString()}万人`,
      note: `人口スコア ${pref.population}`
    };
  }

  if (key === "area") {
    const area = Math.round(pref.area * 850);
    return {
      label: "面積",
      value: `約${area.toLocaleString()}km²`,
      note: `面積スコア ${pref.area}`
    };
  }

  if (key === "height") {
    const cm = (158 + pref.height * 0.18).toFixed(1);
    return {
      label: "平均身長",
      value: `約${cm}cm`,
      note: `身長スコア ${pref.height}`

    return {
      label: "農業",
      value: `${pref.agriculture}点`,
      note: "農業・食の強さを表すゲーム用指数"
    };
  }

  if (key === "industry") {
    return {
      label: "工業",
      value: `${pref.industry}点`,
      note: "ものづくり力を表すゲーム用指数"
    };
  }

  if (key === "academics") {
    return {
      label: "学力",
      value: `${pref.academics}点`,
      note: "学力の強さを表すゲーム用指数"
    };

  if (key === "sports") {
    return {
      label: "体育",
      value: `${pref.sports}点`,
      note: "運動・スポーツ力を表すゲーム用指数"

  if (key === "tourism") {
    return {
      label: "観光",
      value: `${pref.tourism}点`,
      note: "観光の強さを表すゲーム用指数"
    };

  if (key === "joke") {
    return {
      label: "ネタ力",
      value: `${pref.joke}点`,

}

function enableTouchReorder(container,options){

    });

      document.addEventListener("pointerup",onEnd,{passive:false});
      document.addEventListener("pointercancel",onEnd,{passive:false});
    }else{
      document.addEventListener("touchmove",onMove,{passive:false});
      document.addEventListener("touchend",onEnd,{passive:false});
      document.addEventListener("touchcancel",onEnd,{passive:false});
    }
  }

  function removeDocumentListeners(){
    if(supportsPointer){
      document.removeEventListener("pointermove",onMove);
      document.removeEventListener("pointerup",onEnd);
      document.removeEventListener("pointercancel",onEnd);
    }else{
      document.removeEventListener("touchmove",onMove);
      document.removeEventListener("touchend",onEnd);
      document.removeEventListener("touchcancel",onEnd);
    }
  }

    const handle=e.target.closest(handleSelector);

    const item=handle.closest(itemSelector);
    if(!item||!container.contains(item))return;
    if(e.cancelable)e.preventDefault();

    const rect=item.getBoundingClientRect();
    const placeholder=document.createElement(item.tagName.toLowerCase()==="li"?"li":"div");
    placeholder.className="dragPlaceholder";
    placeholder.style.height=rect.height+"px";
    placeholder.style.width=rect.width+"px";
    if(item.tagName.toLowerCase()==="li")placeholder.style.listStyle="none";
    const clone=item.cloneNode(true);
    clone.classList.add("floatingDragCard");
    clone.style.setProperty("--drag-w",rect.width+"px");
    clone.style.height=rect.height+"px";
    document.body.appendChild(clone);
    const oldDisplay=item.style.display;
    item.parentNode.insertBefore(placeholder,item);
    item.style.display="none";

    if(e.cancelable)e.preventDefault();
    const point=getPoint(e);
    moveClone(point.x,point.y);
    movePlaceholder(point.y);
  }

  function onEnd(e){

on('rst',()=>{S.clear();state.playerCount=2;state.pickPer=2;state.draftType='order';state.category='overall';mkPlayers();alert('保存データをリセットしました');render();});
on('goDraft',()=>{state.pickTurn=0;state.pickRound=1;state.search='';state.players.forEach((p,i)=>{p.name=p.name||`プレイヤー${i+1}`;p.picks=[];p.wins=0;p.bonusHits=0});S.set('tdb_save',{playerCount:state.playerCount,pickPer:state.pickPer,draftType:state.draftType,category:state.category,players:state.players.map(p=>({name:p.name,hometown:p.hometown}))});state.screen='draft';render()});
document.getElementById('srch')?.addEventListener('input',e=>{state.search=e.target.value;render()});document.querySelectorAll('.pref').forEach(el=>el.onclick=()=>togglePick(+el.dataset.id));
on('toOrder',()=>{state.orderTurn=0;state.screen='order';render()});
const list=document.getElementById('olist');
if(list){
  enableTouchReorder(list,{
    itemSelector:'.od',
    handleSelector:'.dragHandle',
    onReorder(oldIndex,newIndex){
      if(oldIndex===newIndex)return;
      const arr=state.players[state.orderTurn].picks;
      const [x]=arr.splice(oldIndex,1);
      arr.splice(newIndex,0,x);
      render();
    }
  });
}
const pl=document.getElementById('playerSort');
if(pl){
  enableTouchReorder(pl,{
    itemSelector:'.od',
    handleSelector:'.dragHandle',
    onReorder(oldIndex,newIndex){
      if(oldIndex===newIndex)return;
      const [x]=state.players.splice(oldIndex,1);
      state.players.splice(newIndex,0,x);
      state.players.forEach((p,i)=>p.id=i+1);
      render();
    }
  });
}
on('orderNext',()=>{if(state.orderTurn<state.players.length-1){state.orderTurn++;render();return}if(!validBeforeBattle()){alert('未選択プレイヤーがいます');return}state.currentRound=1;state.battleLog=[];prepareRoundCategory();state.screen='battle';render()});
on('fr',fightRound);on('nr',nextRound);on('share',async()=>{const rank=[...state.players].sort((a,b)=>b.wins-a.wins);const txt=`都道府県ドラフトバトル結果\n1位: ${rank[0]?.name||'-'} ${rank[0]?.wins||0}勝\nMVP: ${(()=>{const m={};state.battleLog.forEach(l=>{const w=l.cards.find(c=>c.p.id===l.winner);if(w)m[w.pref.name]=(m[w.pref.name]||0)+1});const e=Object.entries(m).sort((a,b)=>b[1]-a[1])[0];return e?`${e[0]}（${e[1]}勝）`:'なし'})()}`;if(navigator.share){try{await navigator.share({title:'都道府県ドラフトバトル結果',text:txt});}catch(e){}}else if(navigator.clipboard){await navigator.clipboard.writeText(txt);alert('結果テキストをコピーしました');}});on('again',()=>{state.screen='setup';mkPlayers();render()});on('home',resetGame);if(state.roomCode)S.set('tdb_room_'+state.roomCode,{screen:state.screen,playerCount:state.playerCount,pickPer:state.pickPer,draftType:state.draftType,category:state.category,players:state.players,pickTurn:state.pickTurn,orderTurn:state.orderTurn,currentRound:state.currentRound,battleLog:state.battleLog});}
// Supabase将来対応（ローカル動作を壊さないガード）
async function createRoom(){if(!state.online.enabled)return} async function joinRoom(){if(!state.online.enabled)return} async function syncIfOnline(){if(!state.online.enabled)return}
state.screen='title';render();
</script>

</body></html>
